<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>A Little World Made Just For You ❤️</title>
    <meta name="description" content="Get well soon, my love.">
    <meta property="og:title" content="A Little World Made Just For You ❤️">
    <meta property="og:description" content="Get well soon, my love.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Great+Vibes&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #0a1030;
            --royal: #1b2a6b;
            --lav: #c8b8f0;
            --blush: #f4b6c8;
            --cream: #fbf1e1;
            --gold: #e8c987;
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'Inter', system-ui, sans-serif;
            --hand: 'Great Vibes', cursive;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            height: auto;
            scroll-behavior: smooth;
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font: 300 1.05rem/1.7 var(--sans);
            overflow-x: hidden
        }

        body.lock {
            overflow: hidden
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%
        }

        #glow {
            position: fixed;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle, rgba(244, 182, 200, .14), transparent 65%);
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%
        }

        main {
            position: relative;
            z-index: 2
        }

        section {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 96px 24px;
            text-align: center;
            position: relative
        }

        section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, transparent, rgba(27, 42, 107, .28) 50%, transparent)
        }

        h1,
        h2,
        h3 {
            font-family: var(--serif);
            font-weight: 400;
            line-height: 1.15
        }

        h1 {
            font-size: clamp(2.4rem, 7vw, 5.2rem);
            max-width: 15ch;
            margin: .4em auto;
            background: linear-gradient(120deg, var(--cream), var(--blush) 50%, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        h2 {
            font-size: clamp(1.9rem, 4.6vw, 3.2rem);
            margin-bottom: .5em
        }

        .hand {
            font-family: var(--hand);
            color: var(--gold);
            font-size: clamp(1.8rem, 5vw, 2.8rem)
        }

        .kicker {
            letter-spacing: .35em;
            text-transform: uppercase;
            font-size: .72rem;
            color: var(--lav)
        }

        .sub {
            max-width: 38ch;
            color: #dcd3ee;
            font-size: 1.1rem
        }

        .btn {
            margin-top: 2rem;
            padding: 16px 34px;
            border-radius: 99px;
            border: 1px solid rgba(232, 201, 135, .6);
            background: rgba(232, 201, 135, .1);
            color: var(--cream);
            font: 400 1rem var(--sans);
            letter-spacing: .06em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(232, 201, 135, .25);
            transition: .4s;
            min-height: 48px
        }

        .btn:hover,
        .btn:focus-visible {
            background: rgba(232, 201, 135, .25);
            box-shadow: 0 0 50px rgba(232, 201, 135, .45);
            transform: translateY(-2px);
            outline: none
        }

        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px
        }

        .rv {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 1.2s ease, transform 1.2s ease
        }

        .rv.in {
            opacity: 1;
            transform: none
        }

        .glass {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .14);
            backdrop-filter: blur(14px);
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35)
        }

        /* intro */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #03061a;
            display: grid;
            place-items: center;
            transition: opacity 1.6s
        }

        #intro canvas {
            width: 100%;
            height: 100%
        }

        /* hero */
        #hero {
            overflow: hidden
        }

        .moon {
            position: absolute;
            top: 9%;
            right: 12%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            box-shadow: inset -22px 6px 0 0 var(--cream);
            filter: drop-shadow(0 0 28px rgba(251, 241, 225, .7));
            animation: breathe 7s ease-in-out infinite
        }

        .castle {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: min(380px, 70vw);
            opacity: .55
        }

        .hills {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 34%
        }

        .flw {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20%;
            pointer-events: none
        }

        @keyframes breathe {
            50% {
                transform: scale(1.05)
            }
        }

        @keyframes sway {
            50% {
                transform: rotate(4deg)
            }
        }

        .sway {
            transform-origin: bottom center;
            animation: sway 5s ease-in-out infinite
        }

        /* story */
        .book {
            max-width: 640px
        }

        .book svg {
            width: min(380px, 80vw);
            margin-bottom: 1rem
        }

        #lines p {
            min-height: 2.2em;
            font-family: var(--serif);
            font-size: clamp(1.3rem, 3.2vw, 1.8rem);
            opacity: 0
        }

        #lines p.on {
            opacity: 1
        }

        #lines p.big {
            color: var(--blush);
            font-style: italic;
            margin-top: .6em
        }

        /* gift */
        .gift {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 2rem auto;
            cursor: pointer;
            background: none;
            border: 0;
            perspective: 600px
        }

        .gift .b {
            position: absolute;
            bottom: 0;
            left: 10px;
            right: 10px;
            height: 110px;
            background: linear-gradient(135deg, var(--royal), #3a3f9a);
            border-radius: 6px;
            box-shadow: 0 0 50px rgba(200, 184, 240, .4)
        }

        .gift .b::after,
        .gift .l::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 22px;
            margin-left: -11px;
            background: var(--gold)
        }

        .gift .l {
            position: absolute;
            left: 0;
            right: 0;
            top: 34px;
            height: 36px;
            background: linear-gradient(135deg, #2a3690, #4a50b0);
            border-radius: 6px;
            transform-origin: left top;
            transition: transform 1s cubic-bezier(.3, 1.4, .5, 1)
        }

        .gift.open .l {
            transform: rotateZ(-38deg) translate(-30px, -26px)
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: .9s
        }

        .items.show {
            max-height: 600px;
            opacity: 1
        }

        .item {
            width: 130px;
            padding: 20px 10px;
            cursor: pointer;
            color: inherit;
            font: inherit;
            transition: transform .4s, border-color .4s;
            text-align: center
        }

        .item:hover {
            transform: translateY(-6px);
            border-color: var(--gold)
        }

        .item b {
            display: block;
            font-size: 2rem;
            font-weight: 400
        }

        .item span {
            font-family: var(--serif);
            font-size: 1.1rem
        }

        #say {
            max-width: 46ch;
            min-height: 5em;
            margin-top: 1.5rem;
            font-family: var(--serif);
            font-size: 1.35rem;
            font-style: italic;
            color: var(--blush)
        }

        /* timeline */
        .tl {
            display: grid;
            gap: 18px;
            max-width: 640px;
            width: 100%;
            text-align: left;
            position: relative;
            padding-left: 34px
        }

        .tl::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: linear-gradient(var(--gold), var(--blush))
        }

        .tl .glass {
            position: relative;
            transform-style: preserve-3d;
            transition: transform .25s
        }

        .tl .glass::before {
            content: "";
            position: absolute;
            left: -31px;
            top: 30px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 14px var(--gold)
        }

        .tl h3 {
            font-size: 1.6rem;
            color: var(--cream)
        }

        .tl p {
            color: #cfc6e6
        }

        /* universe */
        #uni {
            width: min(620px, 94vw);
            aspect-ratio: 1;
            touch-action: manipulation
        }

        #uni .m {
            cursor: pointer
        }

        #uni .m circle:first-child {
            fill: rgba(232, 201, 135, .2)
        }

        #uni .m circle:last-child {
            fill: #fff6d6
        }

        #uni .m:hover circle:first-child,
        #uni .m:focus circle:first-child {
            fill: rgba(232, 201, 135, .55)
        }

        .memo {
            max-width: 380px;
            min-height: 150px;
            margin-top: 1rem
        }

        .memo h3 {
            color: var(--gold);
            font-size: 1.5rem
        }

        .memo img {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px
        }

        /* gallery */
        .gal {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1000px;
            width: 100%
        }

        .pol {
            background: #fbf6ec;
            color: #2b2540;
            padding: 14px 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            border: 0;
            font: inherit;
            box-shadow: 0 22px 50px rgba(0, 0, 0, .45);
            transition: transform .5s, box-shadow .5s;
            transform: rotate(var(--r))
        }

        .pol:hover,
        .pol:focus-visible {
            transform: rotate(0) translateY(-8px) scale(1.03)
        }

        .pol .ph {
            aspect-ratio: 1;
            border-radius: 3px;
            background: linear-gradient(135deg, #b9a6e8, #f4b6c8);
            display: grid;
            place-items: center;
            font: 600 .7rem var(--sans);
            letter-spacing: .2em;
            color: #fff;
            position: relative;
            overflow: hidden
        }

        .pol .ph::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .18;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 3px 3px
        }

        .pol img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .pol i {
            display: block;
            margin-top: 12px;
            font: 400 1.7rem var(--hand);
            font-style: normal
        }

        #lb {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            place-items: center;
            background: rgba(5, 8, 30, .7);
            backdrop-filter: blur(14px);
            padding: 24px
        }

        #lb.on {
            display: grid
        }

        #lb .pol {
            max-width: 460px;
            width: 100%;
            transform: none;
            cursor: default;
            animation: pop .5s cubic-bezier(.2, 1.3, .4, 1)
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.8)
            }
        }

        /* tired */
        #tired {
            background: radial-gradient(ellipse at 50% 100%, #1b2a6b55, transparent 70%)
        }

        #tired p {
            opacity: 0;
            transition: opacity 2s;
            font-family: var(--serif);
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            margin: .15em 0
        }

        #tired p.on {
            opacity: 1
        }

        #tired .a {
            color: var(--blush);
            font-style: italic;
            margin-bottom: 1em
        }

        #tired .glow {
            font-size: clamp(2rem, 5.5vw, 3.8rem) !important;
            color: var(--cream);
            text-shadow: 0 0 30px var(--lav), 0 0 60px var(--blush)
        }

        /* heart */
        #hc {
            display: block;
            width: min(680px, 92vw);
            height: min(360px, 60vw);
            min-height: 240px;
            cursor: pointer;
            touch-action: manipulation
        }

        .heartbtn {
            background: none;
            border: 0;
            cursor: pointer;
            display: block;
            margin: auto
        }

        /* letter */
        .env {
            position: relative;
            width: min(300px, 80vw);
            height: 200px;
            margin: 2rem auto;
            perspective: 900px
        }

        .env .bk {
            position: absolute;
            inset: 0;
            background: linear-gradient(#e9d6c0, #d9bfa6);
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5)
        }

        .env .fl {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 110px;
            background: #e2cab3;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform .9s;
            z-index: 3
        }

        .env .seal {
            position: absolute;
            left: 50%;
            top: 84px;
            transform: translateX(-50%);
            z-index: 4;
            font-size: 1.8rem;
            transition: opacity .4s;
            filter: drop-shadow(0 0 10px #f4b6c8)
        }

        .env.open .fl {
            transform: rotateX(180deg);
            z-index: 0
        }

        .env.open .seal {
            opacity: 0
        }

        #letter {
            max-width: 580px;
            width: 100%;
            margin-top: 1rem;
            padding: 44px 34px;
            color: #3a2f3f;
            background: linear-gradient(#fbf3e4, #f3e4cc);
            border-radius: 6px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 60px rgba(244, 182, 200, .2);
            text-align: left;
            display: none;
            transform: translateY(60px);
            opacity: 0
        }

        #letter.show {
            display: block;
            animation: rise 1.8s forwards
        }

        @keyframes rise {
            to {
                transform: none;
                opacity: 1
            }
        }

        #letter p {
            font: 400 clamp(1.5rem, 3.4vw, 1.9rem)/1.45 var(--hand);
            margin: .45em 0;
            opacity: 0;
            animation: fi 1.2s forwards
        }

        @keyframes fi {
            to {
                opacity: 1
            }
        }

        /* final */
        #final svg {
            width: min(560px, 92vw);
            position: absolute;
            bottom: 0
        }

        .shoot {
            position: absolute;
            top: 12%;
            left: -10%;
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff);
            opacity: 0;
            transform: rotate(22deg)
        }

        .shoot.go {
            animation: sh 2.2s ease-out
        }

        @keyframes sh {
            0% {
                opacity: 1;
                transform: translate(0) rotate(22deg)
            }

            100% {
                opacity: 0;
                transform: translate(110vw, 45vh) rotate(22deg)
            }
        }

        #final .t {
            position: relative;
            z-index: 3;
            opacity: 0;
            transition: opacity 2s;
            min-height: 1.4em
        }

        #final .t.on {
            opacity: 1
        }

        #final .big {
            font-family: var(--hand);
            font-size: clamp(3rem, 10vw, 6.5rem);
            color: var(--blush);
            text-shadow: 0 0 40px rgba(244, 182, 200, .6);
            line-height: 1.2
        }

        /* music + hearts */
        #music {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 99px;
            cursor: pointer;
            color: var(--cream);
            font: 400 .85rem var(--sans);
            background: rgba(10, 16, 48, .65);
            border: 1px solid rgba(255, 255, 255, .2);
            backdrop-filter: blur(10px);
            min-height: 44px
        }

        .eq {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 14px
        }

        .eq i {
            width: 3px;
            height: 4px;
            background: var(--gold);
            border-radius: 2px
        }

        #music.on .eq i {
            animation: eq .9s ease-in-out infinite
        }

        #music.on .eq i:nth-child(2) {
            animation-delay: .2s
        }

        #music.on .eq i:nth-child(3) {
            animation-delay: .4s
        }

        @keyframes eq {
            50% {
                height: 14px
            }
        }

        .fh {
            position: fixed;
            bottom: -30px;
            z-index: 80;
            pointer-events: none;
            animation: up var(--d) linear forwards;
            color: var(--blush);
            text-shadow: 0 0 10px var(--blush)
        }

        @keyframes up {
            to {
                transform: translateY(-115vh) translateX(var(--x));
                opacity: 0
            }
        }

        #hug {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: grid;
            place-items: center;
            background: rgba(10, 16, 48, .55);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
            font: italic 400 clamp(1.8rem, 5vw, 3.4rem) var(--serif);
            padding: 30px;
            text-align: center
        }

        #hug.on {
            opacity: 1
        }

        @media(max-width:600px) {
            .moon {
                width: 60px;
                height: 60px;
                box-shadow: inset -14px 4px 0 0 var(--cream)
            }

            #glow {
                display: none
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }

            html {
                scroll-behavior: auto
            }
        }
    </style>
</head>

<body>
    <div id="intro" aria-hidden="true"><canvas id="ic"></canvas></div>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="glow"></div>
    <button id="music" aria-pressed="false" aria-label="Toggle music"><span
            class="eq"><i></i><i></i><i></i></span><span>🎵 Our Little Song</span></button>
    <div id="hug"></div>
    <div id="lb" role="dialog" aria-modal="true"></div>
    <main id="app"></main>
